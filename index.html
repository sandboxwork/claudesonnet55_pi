<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06080f" />
    <title>π — 원주율 모션그래픽</title>
    <meta name="description" content="원, 지름, 둘레, 아르키메데스의 다각형, 무한소수, 파동으로 이어지는 원주율 π의 인터랙티브 모션그래픽" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306080f'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23ffb547' font-family='serif' font-style='italic'%3E%CF%80%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="page">
      <div class="player" id="player" tabindex="0" aria-label="원주율 모션그래픽 플레이어">
        <div class="stage" id="stage">
          <canvas id="cv" aria-hidden="true"></canvas>

          <svg id="ov" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <clipPath id="chClip"><rect x="1330" y="64" width="540" height="168" /></clipPath>
              <linearGradient id="soft" x1="0" x2="1" y1="0" y2="0">
                <stop offset="0" stop-color="#fff" />
                <stop offset="0.86" stop-color="#fff" />
                <stop offset="1" stop-color="#000" />
              </linearGradient>
              <mask id="fMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
                <rect id="fRect" x="260" y="40" width="0" height="220" fill="url(#soft)" />
              </mask>
              <mask id="tMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
                <rect id="tRect" x="400" y="740" width="0" height="130" fill="url(#soft)" />
              </mask>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="b" />
                <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>
            </defs>

            <text id="pi" x="960" y="500" text-anchor="middle" dominant-baseline="central"
              font-size="340" font-style="italic" font-weight="600" filter="url(#glow)"
              fill="#ffb547" stroke="#ffd9a0" stroke-width="2.2" stroke-dasharray="2600" stroke-dashoffset="2600"
              style="font-family:'Cormorant Garamond','Noto Serif KR','Times New Roman',Georgia,serif;opacity:0">π</text>

            <g mask="url(#fMask)">
              <text id="formula" x="960" y="170" text-anchor="middle" dominant-baseline="central"
                font-size="108" font-style="italic" fill="#f3efe4" opacity="0"
                style="font-family:'Cormorant Garamond','Noto Serif KR','Times New Roman',Georgia,serif"></text>
            </g>

            <g clip-path="url(#chClip)">
              <text id="chNum" x="1868" y="90" text-anchor="end" font-size="26" fill="#ffb547" letter-spacing="6" opacity="0"
                style="font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace"></text>
              <text id="chWord" x="1868" y="204" text-anchor="end" font-size="104" font-weight="800"
                fill="none" stroke="#f3efe4" stroke-width="2.4" opacity="0"
                style="font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif"></text>
            </g>

            <g mask="url(#tMask)">
              <text id="title" x="960" y="810" text-anchor="middle" dominant-baseline="central"
                font-size="62" font-weight="300" letter-spacing="14" fill="#f3efe4" opacity="0"
                style="font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif"></text>
            </g>
          </svg>

          <div class="brand" aria-hidden="true"><span class="brand-pi">π</span><span>원주율</span></div>
          <div class="captions" id="captions" aria-live="off"></div>

          <div class="overlay" id="overlay" hidden>
            <button class="big-btn" id="bigBtn" type="button" aria-label="재생">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" /></svg>
            </button>
            <p class="overlay-title" id="ovTitle"></p>
            <p class="overlay-sub" id="ovSub"></p>
            <div class="overlay-actions" id="ovActions"></div>
          </div>

          <div class="toast" id="toast" role="status" hidden></div>
        </div>

        <div class="controls" id="controls">
          <button class="ctl" id="btnPlay" type="button" aria-label="재생/일시정지" title="재생/일시정지 (Space)">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.6-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.2" /><rect x="13.8" y="5" width="4.2" height="14" rx="1.2" /></svg>
          </button>
          <button class="ctl" id="btnReplay" type="button" aria-label="처음부터 다시 재생" title="Replay (R)">
            <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z" /></svg>
          </button>
          <span class="time" id="time">0:00 / 0:00</span>

          <div class="progress" id="progress" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="track"><div class="buffer" id="pBuf"></div><div class="fill" id="pFill"></div></div>
            <div class="ticks" id="pTicks"></div>
            <div class="thumb" id="pThumb"></div>
            <div class="tip" id="pTip"></div>
          </div>

          <button class="ctl" id="btnMute" type="button" aria-label="음소거" title="음소거 (M)">
            <svg class="i-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5H4Z" /><path d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            <svg class="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L13 19V5L7.6 9.5H4Z" /><path d="m16 9.5 5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
          </button>
          <button class="ctl" id="btnCC" type="button" aria-label="자막" title="자막 (C)" aria-pressed="true">
            <svg viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm2.6 9.6c.7.5 1.5.8 2.5.8 1 0 1.8-.3 2.4-.8l-.7-1.2c-.4.3-1 .5-1.6.5-1.1 0-1.8-.7-1.8-1.9s.7-1.9 1.8-1.9c.6 0 1.2.2 1.6.5l.7-1.2c-.6-.5-1.4-.8-2.4-.8-2 0-3.3 1.3-3.3 3.4 0 1 .3 1.9.8 2.6Zm6.6 0c.7.5 1.5.8 2.5.8 1 0 1.8-.3 2.4-.8l-.7-1.2c-.4.3-1 .5-1.6.5-1.1 0-1.8-.7-1.8-1.9s.7-1.9 1.8-1.9c.6 0 1.2.2 1.6.5l.7-1.2c-.6-.5-1.4-.8-2.4-.8-2 0-3.3 1.3-3.3 3.4 0 1 .3 1.9.8 2.6Z" /></svg>
          </button>
          <button class="ctl" id="btnFs" type="button" aria-label="전체 화면" title="전체 화면 (F)">
            <svg class="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <svg class="i-fsx" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
        </div>
      </div>
      <p class="hint">Space 재생/일시정지 · ←/→ 5초 이동 · R 처음부터 · F 전체 화면 · M 음소거 · C 자막 · 1–7 장면 이동</p>
    </main>
  </body>
</html>
